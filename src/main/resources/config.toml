# ============================================================
#  VWhisper —— 跨服私聊配置
#  改完之后：游戏内敲 /vwhisper reload（需要 vwhisper.reload 权限），
#            或者在控制台直接敲 /vwhisper reload
#  ⚠️ 写在 # 后面的是注释。注意：没加引号的值不要在同一行再写 # 注释。
# ============================================================

# ------------------------------------------------------------
# 服务器名单：哪些子服参与私聊
#   blacklist = 名单里的服不能发也不能收（默认，空名单 = 全都行）
#   whitelist = 只有名单里的服能用（空名单 = 全服都发不出去，慎用）
# 服名写 velocity.toml 的 [servers] 里的名字，大小写不敏感
# 例：想让起床服不影响别人也不被人打扰 → mode = "blacklist"、list = ["bedwars"]
# ------------------------------------------------------------
[servers]
mode = "blacklist"
list = []

# ------------------------------------------------------------
# 权限：没在 LuckPerms 里配过的权限节点算不算有？
#   true  = 普通节点（vwhisper.msg / reply / toggle / ignore）默认人人可用
#   false = 必须去 LuckPerms 显式给，不给就发不出私聊
# ⚠️ 特权节点不受这一项影响，一律要显式给：
#   vwhisper.spy、vwhisper.reload、各种 bypass、vwhisper.msg.color
# ------------------------------------------------------------
[permissions]
allow-by-default = true

# ------------------------------------------------------------
# 能不能给自己发私聊（自言自语）
#   true  = 可以。/msg 自己的名字 就能给自己发 —— 当随身便签用（记坐标、记待办）
#   false = 不行，会提示 messages.self-message
#
# 允许时的几个细节：
#   · 只发一条（用 [format].sender 那套「我 → 我」），不会同一句话收两遍
#   · 自己的「关接收」/「屏蔽」对自己不算数 —— 自己跟自己说话没有拒收这一说
#   · 不进 /reply 记忆 —— 自言自语之后敲 /r 还是找上一个真正聊过的人
#   · 窥屏的人看不到（自己跟自己说话不广播）
# ⚠️ 服务器名单、冷却照旧生效。
# ------------------------------------------------------------
[general]
allow-self-message = true

# ------------------------------------------------------------
# 玩家在私聊内容里写的颜色码怎么处理
#   strip = 一律剥掉（&c 会被删掉，看不见）
#   parse = 一律解析（所有人都能用 &c、&#FF0000、{#FF0000>}渐变{#0000FF<}）
#   keep  = 原样保留（会把 &c 原样显示出来）
# ⚠️ 有 vwhisper.msg.color 权限的玩家，不管这里配什么都按 parse 处理。
# ⚠️ 渐变不单独设权限 —— 能用颜色就能用渐变。
# ------------------------------------------------------------
[colors]
mode = "parse"

# ------------------------------------------------------------
# 消息格式
#   minimessage = false 时下面这些串用 & 颜色码写（&#RRGGBB 这种十六进制也认）；
#                 true  时改用 MiniMessage 语法（<red>、<#FF0000>、<gradient:#FFF:#000>…</gradient>）
# 可用占位符：
#   #sender#          发送者名字      #target#          接收者名字
#   #sender-server#   发送者所在服    #target-server#   接收者所在服
#   #message#         消息内容（永远放在最后）
# 控制台群发 /msg 时，#sender# = 控制台、#sender-server# = console
#
# ⚠️ 紧挨着 #message# 前面的那个颜色码会「带」给消息内容本身：
#       "...&8]&r&7 #message#"  → 消息是灰的
#       "...&8]&r #message#"    → 消息不带颜色，客户端按默认（白）显示
#    带过去的只是「底色」：消息里玩家自己写的 &c 之类照旧盖掉它。
#    颜色码后面哪怕一个字都没有（写成 &7#message#）也一样有效。
# ------------------------------------------------------------
[format]
minimessage = false
sender = "&8[&7我 &8→ &7#target#&8]&r&7 #message#"
receiver = "&8[&7#sender# &8→ &7我&8]&r&7 #message#"
spy = "&8[&7#sender# &8→ &7#target#&8]&r&7 #message#"
# 从控制台发出的那一份（发给玩家看的）
console = "&8[&c控制台 &8→ &7我&8]&r #message#"

# ------------------------------------------------------------
# 悬停提示 / 点击动作：鼠标放在私聊上能看见什么、点一下会发生什么
#
#   整条消息（除了 #message# 那截）  → 悬停显示 prefix + hover，点一下把 suggest 填进聊天框
#   正文（#message#，真正说的那句话）→ 悬停显示 copy-hover，点一下复制到剪贴板
#
# enabled = false 整个关掉（两档都不挂，跟没这个功能一样）
#
# ★ prefix：悬停提示前面再加一截。可用占位符：
#     #sender#  /  #target#  /  #sender-server#  /  #target-server#  （跟 [format] 里那四个一样）
#     #server#   发送者所在服（等于 #sender-server#，「这条消息从哪个服来」）
#     {server}   同上      {player}  这条私聊的对方（点一下要 /msg 谁）
#     {time}     发送时间
#   ⚠️ 它是直接拼在 hover 前面的，不会自动加分隔符 —— 想空格/换行就自己写在末尾
#      （末尾那个空格会原样保留，不会被吞）
#
# ★ suggest：点一下填进聊天框的命令（**不是直接发出去**，玩家可以接着改）。
#   默认 " /msg{player} " —— 收件人点一下就填好 "/msg 发送者 "，直接打内容就能回。
#   看回执的发送者那边，{player} 是收件人；窥屏的人看到的也是发送者。
#
# ★ copy / copy-hover：正文那截。copy = false 整个关掉（正文恢复成跟前后一样）；
#   copy-hover 留空 = 只不显示提示，点击照样复制。
# ------------------------------------------------------------
[Tooltip]
enabled = true
prefix = "&8[&6#server#&8] "
hover = "&e发送时间: &6{time}"
# suggest 末尾留一个空格，玩家点完接着就能输入内容
suggest = " /msg{player} "
copy = true
copy-hover = "&7复制该文本"

# {time} 的时间格式（Java 写法）
#   HH:mm:ss              16:38:25
#   yyyy-MM-dd HH:mm:ss   2026-10-06 16:38:25
#   a h:mm                下午 4:38
time-format = "HH:mm:ss"

# {time} 用的时区；留空 = 服务器系统时区。例子："Asia/Shanghai"
time-zone = ""

# ------------------------------------------------------------
# 各种提示语。#target# / #seconds# / #amount# 会被自动替换，
# 每条前面会自动拼上下面的 prefix
# ------------------------------------------------------------
[messages]
prefix = ""
no-permission = "&c你没有权限这么做"
players-only = "&c这条命令只有玩家能用"
# ⚠️ #label# 会自动换成玩家真正敲的那个命令（走 /msg 就是 /msg，走 /vw msg 就是 /vw msg）
usage-msg = "&7用法：&f#label# <玩家> <消息>"
usage-reply = "&7用法：&f#label# <消息>"
usage-ignore = "&7用法：&f#label# <玩家>"
unknown-subcommand = "&c不存在 &7#sub# &c子命令，输入 &f#label# help &c查看命令列表"
player-not-found = "&c找不到在线玩家 &7#target#&c"
ambiguous-target = "&7#target# &c有多个人名匹配，多打几个字"
self-message = "&c不能给自己发私聊"
target-off = "&6#target# &e关闭私聊，消息没有发出去"
target-ignored = "&6#target# &e屏蔽了你，消息没有发出去"
server-denied = "&c此服务器关闭了私聊功能"
cooldown = "&c慢一点，还要 &7#seconds# &c秒"
no-reply-target = "&c还没有可以回复的人"
reply-target-offline = "&c你要回复的人已经下线了"
spy-on = "&e已开启私聊窥屏"
spy-off = "&e已关闭私聊窥屏"
toggle-off = "&e已关闭接收私聊"
toggle-on = "&e已恢复接收私聊"
ignore-added = "&e已屏蔽 &6#target#"
ignore-removed = "&e已取消屏蔽 &6#target#"
ignore-self = "&c不能屏蔽自己"
reloaded = "&a配置已重新加载"
reload-failed = "&c配置加载失败，用的还是旧配置原因：#reason#"
unknown-target-in-past = "&c对方已经不在了"

# ------------------------------------------------------------
# 冷却：同一个玩家多久只能发一条（秒）。0 = 不限。
# 有 vwhisper.cooldown.bypass 权限的人不受限制。
# ------------------------------------------------------------
[cooldown]
seconds = 0

# ------------------------------------------------------------
# 收到私聊时给对方放个提示音。enabled = false 关掉。
# 音效名是原版 id，留空也可以。
# ------------------------------------------------------------
# ------------------------------------------------------------
# 提示音。分三档，各档独立开关、独立音效：
#
#   [sound.target]  收到私聊的人      （默认开 —— 就是「有人私聊你」的提醒）
#   [sound.sender]  发出私聊的人      （默认关，发件回执音，开着会有点吵）
#   [sound.spy]     开着 /spy 窥屏的人（默认关）
#
# 🔴 自言自语（/msg 自己）一律不响 —— 「提醒」只在【别人】发给你时才成立
# 🔴 下面的总闸关掉时，三档都不响；各档自己的 enabled 也要为 true 才响
#
# name   音效 id。**必须全小写**（minecraft:xxx），大写/空格会让整条音效失效并退回默认值
#        想用资源包里的自定义音效就写 命名空间:音效名，例如 "mypack:ding"
# source 走游戏设置里哪个音量滑块：master / music / record / weather / block /
#        hostile / neutral / player / ambient / voice / ui。写歪退回 player
#        （提示音归 master 更稳 —— 玩家把「玩家」那栏调静音时私聊提示不会跟着没）
# ------------------------------------------------------------
[sound]
enabled = true

[sound.target]
enabled = true
name = "minecraft:entity.experience_orb.pickup"
volume = 1.0
pitch = 1.0
source = "player"

[sound.sender]
enabled = false
name = "minecraft:entity.experience_orb.pickup"
volume = 1.0
pitch = 1.0
source = "player"

[sound.spy]
enabled = false
name = "minecraft:entity.experience_orb.pickup"
volume = 1.0
pitch = 1.0
source = "player"

# ------------------------------------------------------------
# 屏蔽名单（/ignore）和「关掉私聊」（/msgtoggle）要不要存下来：
# 存了的话代理重启后玩家的设置在。存在 plugins/vwhisper/ 下面。
# spy 状态一律不存 —— 重启自动关，免得忘记关掉。
# ------------------------------------------------------------
[storage]
save-ignores = true
save-toggles = true

# ------------------------------------------------------------
# 命令名与别名
#   整个插件只有一个命令入口：/vwhisper。私聊、屏蔽、窥屏、重载全是它的子命令：
#     /vw msg <玩家> <消息>    /vw reply <消息>    /vw toggle [on|off]
#     /vw ignore <玩家>        /vw spy [on|off]    /vw reload
#     /vw help                 /vw version
#   root = 主命令 /vwhisper 的别名（想叫 /vw 之外的名字就改这里，写 [] 就只用 /vwhisper）
#   下面每一行是「子命令主名 = [别名...]」，别名是 /vw 后面敲的那个词，
#   不参与 Velocity 的命令注册，所以跟别的插件撞名也没事。
# ------------------------------------------------------------
[commands]
root = ["vw"]
msg = ["m", "tell", "w", "whisper"]
reply = ["r"]
toggle = ["msgtoggle"]
ignore = []
spy = ["msgspy"]
reload = []
version = ["info"]
help = ["?"]

# ------------------------------------------------------------
# 顶层快捷命令：把子命令直接注册成 /msg、/w 这种短命令，不用敲 /vw 前缀
#   格式：命令名 = "子命令主名"（左边是要注册的命令名，右边是它干的事）
#
# ⚠️ 重点：代理上谁注册了命令谁说了算。这里注册了 /msg，玩家敲 /msg 就由代理处理，
#   根本不会转发到后端子服 —— 也就是说后端自己的 /msg（CMI 的那个）会被彻底盖掉。
#   这是故意的：全服私聊统一走 VWhisper，顺带就跨服了。
#   子服里带前缀的写法（/cmi msg）不受影响，被接管的只是短命令。
#
# ⚠️ 命令名在起服时注册 —— 改这里要重启代理（config 的其它部分仍可 /vw reload 热更新）。
# ⚠️ 名字被别的插件先占了会注册失败，起服日志里会有 WARN，插件其它功能不受影响。
# 不想接管哪个就把那一行删掉（或注释掉）。
# ------------------------------------------------------------
[shortcuts]
msg = "msg"
w = "msg"
m = "msg"
tell = "msg"
whisper = "msg"
reply = "reply"
r = "reply"

# ------------------------------------------------------------
# 杂项
#   auto-reload = 改了本文件不用敲命令，自己会在几秒内热重载（按修改时间判断）
#   log-to-console = 每条私聊往控制台打一行（查纠纷用）
# ------------------------------------------------------------
[advanced]
auto-reload = false
auto-reload-interval-seconds = 3
log-to-console = true
